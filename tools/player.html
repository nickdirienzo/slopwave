<!doctype html>
<html lang="en"><meta charset="utf-8"><title>slopwave</title>
<style>body{font:18px system-ui;max-width:38rem;margin:4rem auto;padding:1rem}button{font:inherit;padding:.5rem 1rem;margin-right:.5rem}pre{white-space:pre-wrap}</style>
<h1>slopwave</h1><p id="title">Loading arrangement…</p>
<button id="play" disabled>Play</button><button id="stop">Stop</button><button id="render" disabled>Download WAV</button>
<pre id="status"></pre>
<script type="module">
import * as S from '/vendor/index.mjs';
const status=document.querySelector('#status');
window.__starts=[];
window.__processorErrors=[];
const WorkletNode=window.AudioWorkletNode;
window.AudioWorkletNode=class extends WorkletNode {
 constructor(context,name,...args) {
  super(context,name,...args);
  this.addEventListener('processorerror',()=>window.__processorErrors.push(name));
 }
};
const start=OscillatorNode.prototype.start;
OscillatorNode.prototype.start=function(when=0,...args){
 window.__starts.push({when,calledAt:this.context.currentTime,frequency:this.frequency.value,type:this.type});
 return start.call(this,when,...args);
};
const bufferStart=AudioBufferSourceNode.prototype.start;
AudioBufferSourceNode.prototype.start=function(when=0,...args){
 // Custom one-shots carry their identity; noise buffers are a separate class.
 if(this.__slopwaveSound) window.__starts.push({when,calledAt:this.context.currentTime,frequency:0,type:this.__slopwaveSound});
 else if(this.loop&&this.buffer?.numberOfChannels===1&&Math.abs(this.buffer.duration-2)<.001)
  window.__starts.push({when,calledAt:this.context.currentTime,frequency:0,type:'white'});
 return bufferStart.call(this,when,...args);
};
try {
 const [score,source]=await Promise.all([fetch('/score.json').then(r=>r.json()),fetch('/score.js').then(r=>r.text())]);
 if(score.soundfonts) throw new Error('Local preview currently supports synthesized arrangements. Use Strudel with the documented sample resources for sampled profiles.');
 const repl=await S.initStrudel();
 const code=source.replace('\nstack(\n','\nglobalThis.__pattern = stack(\n');
 const moduleMode=new URLSearchParams(location.search).has('module');
 let song;
 if(moduleMode) {
  song=await import('/song.mjs');
  await song.preload(S);
  globalThis.__pattern=song.createPattern(S);
 } else await S.evaluate(code,false);
 if(!globalThis.__pattern) throw new Error('Pattern evaluation failed');
 window.__score=score; window.__ready=true;
 const play=async()=>{
  await S.initAudio();
  await S.getAudioContext().resume();
  if(moduleMode) { repl.setCps(song.cps); await repl.setPattern(globalThis.__pattern, true); }
  else await S.evaluate(code,true);
  window.__playing=true;
  window.__context=S.getAudioContext();
  status.textContent='Playing';
 };
 const render=async()=>{
  await S.initAudio();
  S.hush(); status.textContent='Rendering…';
  const params=new URLSearchParams(location.search);
  const begin=Number(params.get('render_begin')??0);
  const end=Number(params.get('render_end')??score.beats/4);
  if(!Number.isFinite(begin)||!Number.isFinite(end)||begin<0||end<=begin||end>score.beats/4) throw new Error('Invalid render interval');
  await S.renderPatternAudio(globalThis.__pattern,score.bpm/240,begin,end,44100,64,false,'slopwave');
  status.textContent='Downloaded WAV. Reload the page to play again.';
  document.querySelector('#play').disabled=true; document.querySelector('#render').disabled=true;
 };
 document.querySelector('#title').textContent=score.title;
 for(const id of ['play','render']) document.querySelector('#'+id).disabled=false;
 document.querySelector('#play').onclick=()=>play().catch(e=>{status.textContent=e.message;window.__failure=e.message;throw e;});
 document.querySelector('#stop').onclick=()=>{S.hush();status.textContent='Stopped';};
 document.querySelector('#render').onclick=()=>render().catch(e=>{status.textContent=e.message;window.__failure=e.message;throw e;});
 window.__stop=()=>S.hush();
}catch(error){status.textContent=error.message;window.__failure=error.message;throw error;}
</script></html>
